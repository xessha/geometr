<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>three.js webgl - геометрические фигуры</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: black;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        Трехмерные фигуры
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';

        var camera, scene, renderer;
        var controls;
        var ambientLight, light;
        init();
        animate();

        function init() {
            var container = document.createElement('div');
            document.body.appendChild(container);

            // CAMERA
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(300, 600, 1000);

            // LIGHTS
            ambientLight = new THREE.AmbientLight(0x444444);
            scene = new THREE.Scene();
            scene.add(ambientLight);

            // Main directional light
            light = new THREE.DirectionalLight(0xFFFFFF, 1.2);
            light.position.set(2, 5, 3);
            scene.add(light);

            // Fill light from below
            var fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
            fillLight.position.set(-1, -1, 0.5);
            scene.add(fillLight);

            // Back light
            var backLight = new THREE.DirectionalLight(0xffaa88, 0.4);
            backLight.position.set(0, 1, -2);
            scene.add(backLight);

            // RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // EVENTS
            window.addEventListener('resize', onWindowResize, false);

            // CONTROLS
            controls = new OrbitControls(camera, renderer.domElement);
            controls.rotateSpeed = 0.8;
            controls.enableZoom = true;
            controls.zoomSpeed = 0.8;
            controls.minDistance = 300;
            controls.maxDistance = 2000;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // scene background
            scene.background = new THREE.Color(0xD3D3D3);

            // ==================== ПЕРВЫЙ РЯД (Z = 0) ====================
            
            // 1. Голубой шар
            var geometry = new THREE.SphereGeometry(80, 64, 64);
            var material = new THREE.MeshStandardMaterial({ color: 0x00BFFF, roughness: 0.3, metalness: 0.1 });
            var sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(-350, 80, 0);
            scene.add(sphere);

            // 2. Желтая пирамида (4-гранная)
            var geometry = new THREE.ConeGeometry(80, 160, 4);
            var material = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.4 });
            var yellowPyramid = new THREE.Mesh(geometry, material);
            yellowPyramid.position.set(0, 80, 0);
            scene.add(yellowPyramid);

            // 3. Розовый прямоугольник
            var geometry = new THREE.BoxGeometry(140, 100, 180);
            var material = new THREE.MeshStandardMaterial({ color: 0xFF69B4, roughness: 0.3 });
            var pinkBox = new THREE.Mesh(geometry, material);
            pinkBox.position.set(350, 50, 0);
            scene.add(pinkBox);

            // ==================== ВТОРОЙ РЯД (Z = 350) ====================
            
            // 4. Фиолетовый конус
            var geometry = new THREE.ConeGeometry(80, 180, 32);
            var material = new THREE.MeshStandardMaterial({ color: 0x9370DB, roughness: 0.3 });
            var purpleCone = new THREE.Mesh(geometry, material);
            purpleCone.position.set(-350, 90, 350);
            scene.add(purpleCone);

            // 5. Зеленый чайник
            var geometry = new TeapotGeometry(75);
            var material = new THREE.MeshStandardMaterial({ color: 0x32CD32, roughness: 0.2, metalness: 0.4 });
            var teapot = new THREE.Mesh(geometry, material);
            teapot.position.set(0, 60, 350);
            scene.add(teapot);

            // 6. Белый усеченный конус - ПЕРЕВЕРНУТ ВВЕРХ НОГАМИ
            var geometry = new THREE.CylinderGeometry(100, 50, 140, 32);
            var material = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            var frustum = new THREE.Mesh(geometry, material);
            frustum.position.set(350, 140, 350);  // Поднял выше, так как после переворота нижняя точка будет выше
            frustum.rotation.x = Math.PI;  // Поворот на 180 градусов вокруг оси X (переворот вверх ногами)
            scene.add(frustum);

            // ==================== ТРЕТИЙ РЯД (Z = -350) ====================
            
            // 7. Красный цилиндр
            var geometry = new THREE.CylinderGeometry(70, 70, 170, 32);
            var material = new THREE.MeshStandardMaterial({ color: 0xFF3333, roughness: 0.3 });
            var redCylinder = new THREE.Mesh(geometry, material);
            redCylinder.position.set(-350, 85, -350);
            scene.add(redCylinder);

            // 8. Красный тетраэдр
            var geometry = new THREE.TetrahedronGeometry(85);
            var material = new THREE.MeshStandardMaterial({ color: 0xDC143C, roughness: 0.2, metalness: 0.1 });
            var tetra = new THREE.Mesh(geometry, material);
            tetra.position.set(0, 85, -350);
            scene.add(tetra);

            // 9. Розовая пирамида
            var geometry = new THREE.ConeGeometry(80, 160, 4);
            var material = new THREE.MeshStandardMaterial({ color: 0xFFB6C1, roughness: 0.4 });
            var pinkPyramid = new THREE.Mesh(geometry, material);
            pinkPyramid.position.set(350, 80, -350);
            scene.add(pinkPyramid);

            // Вспомогательная сетка
            const helper = new THREE.GridHelper(1200, 20, 0x888888, 0xaaaaaa);
            helper.position.y = -20;
            scene.add(helper);
            
            // Добавим простые оси для ориентации (опционально)
            const axesHelper = new THREE.AxesHelper(400);
            axesHelper.material.transparent = true;
            axesHelper.material.opacity = 0.15;
            scene.add(axesHelper);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            render();
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
